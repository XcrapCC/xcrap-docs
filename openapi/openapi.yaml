  /v1/user/history:
    get:
      operationId: userHistory
      summary: An account's posts, in bulk
      description: >-
        Walks an account's timeline and returns up to 1,000 posts in one response, newest first,
        optionally inside a date window. The walk takes about a second per twenty posts, so for a
        large export ask for format=ndjson: posts then arrive one per line as they are fetched,
        roughly newest first, instead of all at once at the end. The further back a window sits, the
        patchier X's own timeline is, so a years-old window can come back thin or empty.


        Rate limit: 4 requests per 5 minute(s) per IP.


        Example:

            https://xcrap.cc/v1/user/history?handle=naval&max_posts=200&since=2025-01-01
      tags:
        - XCrap
      parameters:
        - name: handle
          in: query
          required: true
          description: The account to export.
          schema:
            type: string
        - name: max_posts
          in: query
          required: false
          description: Stop after this many posts, 1 to 1000.
          schema:
            type: integer
            default: '200'
        - name: since
          in: query
          required: false
          description: Oldest post to include, as a date such as 2025-01-01 or a full ISO timestamp.
          schema:
            type: string
        - name: until
          in: query
          required: false
          description: Newest post to include, as a date or a full ISO timestamp.
          schema:
            type: string
        - name: include_replies
          in: query
          required: false
          description: Include the account's replies to other people.
          schema:
            type: boolean
            default: 'false'
        - name: include_reposts
          in: query
          required: false
          description: Include posts the account reposted from other accounts.
          schema:
            type: boolean
            default: 'false'
        - name: format
          in: query
          required: false
          description: >-
            Response format: json, markdown, yaml, csv or html, or ndjson to stream one post per
            line. Overrides the Accept header.
          schema:
            type: string
            enum:
              - json
              - markdown
              - yaml
              - csv
              - html
              - ndjson
            default: json
        - name: fresh
          in: query
          required: false
