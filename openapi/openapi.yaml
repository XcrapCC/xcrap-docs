  /v1/search:
    get:
      operationId: search
      summary: Search posts
      description: >-
        Full-text search over X, with the operators X search understands: from:, to:, "exact
        phrase", -exclude, lang:, filter:links and the rest. Choose the latest or top posts, or only
        posts with photos or videos. One page per call; pass next_cursor for the next. Search has
        the tightest budget of any endpoint, and its results are cached for ten minutes.


        Rate limit: 10 requests per 15 minute(s) per IP.


        Example:

            https://xcrap.cc/v1/search?q=from:nasa%20mars&feed=latest&format=markdown
      tags:
        - XCrap
      parameters:
        - name: q
          in: query
          required: true
          description: What to search for, including any X search operators.
          schema:
            type: string
        - name: feed
          in: query
          required: false
          description: latest, top, photos or videos.
          schema:
            type: string
            enum:
              - latest
              - top
              - photos
              - videos
            default: latest
        - name: since
          in: query
          required: false
          description: Oldest post to match, as a date such as 2025-01-01 or a full ISO timestamp.
          schema:
            type: string
        - name: until
          in: query
          required: false
          description: Newest post to match, as a date or a full ISO timestamp.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: The next_cursor from a previous response.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: 'Response format: json, markdown, yaml, csv or html. Overrides the Accept header.'
          schema:
            type: string
            enum:
              - json
