  /v1/replies:
    get:
      operationId: replies
      summary: The replies under a post
      description: >-
        One page of the replies to a post, most liked first or newest first, with the post itself
        included. Only direct replies come back: a reply to a reply belongs to its own conversation.
        There is no paging: this is the single page X serves for the post, up to about a hundred
        replies.


        Rate limit: 15 requests per 1 minute(s) per IP.


        Example:

            https://xcrap.cc/v1/replies?url=https://x.com/naval/status/1002103360646823936&sort=top&format=markdown
      tags:
        - XCrap
      parameters:
        - name: url
          in: query
          required: true
          description: 'The post whose replies to read: its URL or numeric id.'
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: top for the most liked first, recent for the newest first.
          schema:
            type: string
            enum:
              - top
              - recent
            default: top
        - name: format
          in: query
          required: false
          description: 'Response format: json, markdown, yaml, csv or html. Overrides the Accept header.'
