  /v1/user/tweets:
    get:
      operationId: userTweets
      summary: An account's posts
      description: >-
        A page of an account's posts, newest first. Paging is by cursor rather than offset, because
        a timeline moves while you read it and an offset would silently skip or repeat posts.


        Rate limit: 15 requests per 1 minute(s) per IP.


        Example:

            https://xcrap.cc/v1/user/tweets?handle=naval&count=20
      tags:
        - XCrap
      parameters:
        - name: handle
          in: query
          required: true
          description: The account to read.
          schema:
            type: string
        - name: count
          in: query
          required: false
          description: How many posts to return, 1 to 100.
          schema:
            type: integer
            default: '20'
        - name: cursor
          in: query
          required: false
          description: The next_cursor from a previous response.
          schema:
            type: string
        - name: exclude_replies
          in: query
          required: false
          description: Leave out replies the account made to other people.
          schema:
            type: boolean
            default: 'true'
        - name: media_only
          in: query
          required: false
          description: Only posts carrying an image or video.
          schema:
            type: boolean
            default: 'false'
        - name: format
          in: query
          required: false
          description: 'Response format: json, markdown, yaml, csv or html. Overrides the Accept header.'
          schema:
            type: string
            enum:
              - json
