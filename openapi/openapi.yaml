  /v1/bulk:
    post:
      operationId: bulk
      summary: Up to fifty posts at once
      description: >-
        Resolve many posts in one request. Failures are per item: one dead link returns an error for
        that entry and every other entry still comes back. GET works too, with repeated or
        comma-separated url parameters.


        Rate limit: 6 requests per 5 minute(s) per IP.


        Example:

            curl -X POST https://xcrap.cc/v1/bulk \
          -H 'content-type: application/json' \
          -d '{"urls":["https://x.com/jack/status/20","1671370010743263233"]}'
      tags:
        - XCrap
      parameters:
        - name: format
          in: query
          required: false
          description: 'Response format: json, markdown, yaml, csv or html. Overrides the Accept header.'
          schema:
            type: string
            enum:
              - json
              - markdown
              - yaml
              - csv
              - html
            default: json
        - name: fresh
          in: query
          required: false
          description: Skip the cache and refetch from upstream. Use sparingly.
          schema:
            type: boolean
            default: 'false'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - urls
              properties:
                urls:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                  description: One to 50 post URLs or ids.
            example:
              urls:
                - https://x.com/jack/status/20
                - '1671370010743263233'
      responses:
        '200':
          description: Success
          headers:
            x-ratelimit-limit:
              schema:
                type: integer
              description: Requests allowed in the window for this endpoint.
            x-ratelimit-remaining:
              schema:
                type: integer
              description: Requests left in the current window.
            x-ratelimit-reset:
              schema:
                type: integer
              description: Unix seconds when the window resets.
            x-xcrap-cache:
              schema:
                type: string
              description: hit, miss or bypass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
            text/markdown:
              schema:
                type: string
              example: |-
                # jack (@jack)

                just setting up my twttr
            application/yaml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '400':
          description: A parameter is missing or malformed. Check it against this page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            The post or account is deleted, suspended, private, or never existed. For a post, reason
            says which when X tells us: post_deleted, author_protected, author_suspended, withheld,
            removed_by_x, age_restricted, or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >-
            Endpoint budget exhausted. Wait for the period in retry-after, or see the enterprise
            plan for higher limits.
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait.
            x-ratelimit-limit:
              schema:
                type: integer
              description: Requests allowed in the window for this endpoint.
            x-ratelimit-remaining:
              schema:
                type: integer
              description: Requests left in the current window.
            x-ratelimit-reset:
              schema:
                type: integer
              description: Unix seconds when the window resets.
            x-xcrap-cache:
              schema:
                type: string
              description: hit, miss or bypass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '451':
          description: That account asked to be excluded from XCrap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Every source refused. Usually brief; retry in a minute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type:
            - string
            - 'null'
        screen_name:
          type: string
        name:
          type: string
        url:
          type:
            - string
            - 'null'
          format: uri
        description:
          type: string
        location:
          type:
            - string
            - 'null'
        website:
          type:
            - string
            - 'null'
        avatar_url:
          type:
            - string
            - 'null'
          format: uri
        banner_url:
          type:
            - string
            - 'null'
          format: uri
        joined:
          type:
            - string
            - 'null'
        verified:
          type: boolean
        verified_type:
          type:
            - string
            - 'null'
          enum:
            - blue
            - legacy
            - individual
            - business
            - government
            - null
        protected:
          type: boolean
        metrics:
          type: object
          properties:
            posts:
              type:
                - integer
                - 'null'
            followers:
              type:
                - integer
                - 'null'
            following:
              type:
                - integer
                - 'null'
            likes:
              type:
                - integer
                - 'null'
            media:
              type:
                - integer
                - 'null'
    MediaVariant:
      type: object
      properties:
        url:
          type: string
          format: uri
        container:
          type:
            - string
            - 'null'
          enum:
            - mp4
            - m3u8
            - null
        bitrate:
          type:
            - integer
            - 'null'
        codec:
          type:
            - string
            - 'null'
    Media:
      type: object
      properties:
        id:
          type:
            - string
            - 'null'
        type:
          type: string
          enum:
            - photo
            - video
            - gif
        url:
          type: string
          format: uri
        thumbnail_url:
          type:
            - string
            - 'null'
          format: uri
        width:
          type:
            - integer
            - 'null'
        height:
          type:
            - integer
            - 'null'
        duration:
          type:
            - number
            - 'null'
          description: Seconds. Video and GIF only.
        format:
          type:
            - string
            - 'null'
        alt_text:
          type:
            - string
            - 'null'
          description: The author's accessibility description.
        variants:
          type: array
          items:
            $ref: '#/components/schemas/MediaVariant'
    Poll:
      type: object
      properties:
        total_votes:
          type:
            - integer
            - 'null'
        ends_at:
          type:
            - string
            - 'null'
        options:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              votes:
                type:
                  - integer
                  - 'null'
              percent:
                type:
                  - number
                  - 'null'
    Tweet:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        text:
          type: string
        lang:
          type:
            - string
            - 'null'
        created_at:
          type:
            - string
            - 'null'
        created_timestamp:
          type:
            - integer
            - 'null'
          description: Unix seconds.
        author:
          $ref: '#/components/schemas/User'
        metrics:
          type: object
          description: null means the source did not report it, not zero.
          properties:
            likes:
              type:
                - integer
                - 'null'
            retweets:
              type:
                - integer
                - 'null'
            replies:
              type:
                - integer
                - 'null'
            quotes:
              type:
                - integer
                - 'null'
            bookmarks:
              type:
                - integer
                - 'null'
            views:
              type:
                - integer
                - 'null'
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        poll:
          oneOf:
            - $ref: '#/components/schemas/Poll'
            - type: 'null'
        quote:
          description: The quoted post, unnested one level.
          oneOf:
            - $ref: '#/components/schemas/Tweet'
            - type: 'null'
        replying_to:
          type:
            - string
            - 'null'
        replying_to_status:
          type:
            - string
            - 'null'
        community_note:
          type:
            - string
            - 'null'
        possibly_sensitive:
          type: boolean
        visibility:
          description: >-
            What X shows readers about how this post may be seen. null when X says nothing, which is
            almost always.
          oneOf:
            - type: object
              properties:
                notice:
                  type:
                    - string
                    - 'null'
                  description: X's notice on the post, in X's words.
                notice_url:
                  type:
                    - string
                    - 'null'
                  format: uri
                reach_limited:
                  type: boolean
                  description: X labels the post as shown less widely.
                limited_actions:
                  type: array
                  items:
                    type: string
                    enum:
                      - quote
                      - copy_link
                      - like
                      - poll_vote
                      - reply
                      - repost
                      - bookmark
                      - share_via_dm
                      - share
                      - embed
                      - react
                  description: Actions X has turned off on this post.
                withheld_in:
                  type:
                    - array
                    - 'null'
                  items:
                    type: string
                  description: Country codes where the post is withheld.
            - type: 'null'
        signals:
          type: object
          description: >-
            Only with signals=true on /v1/tweet. Facts from public data, not a ranking score or a
            prediction.
          properties:
            age_seconds:
              type:
                - integer
                - 'null'
            in_for_you_window:
              type:
                - boolean
                - 'null'
              description: Under 48 hours old, the window X's For You feed draws from.
            new_author_slot:
              type: string
              enum:
                - possibly_eligible
                - not_eligible
                - unknown
              description: >-
                X reserves a slot for authors with at most 1,000 followers, on posts under 48 hours
                old with under 1,000 Home impressions. Home impressions are not public, so this
                never says more than possibly.
            engagement_mix:
              type: object
              properties:
                replies_per_like:
                  type:
                    - number
                    - 'null'
                quotes_per_like:
                  type:
                    - number
                    - 'null'
                reposts_per_like:
                  type:
                    - number
                    - 'null'
                likes_per_view:
                  type:
                    - number
                    - 'null'
        is_note_tweet:
          type: boolean
          description: True for posts over 280 characters.
        entities:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - url
                  - mention
                  - hashtag
              text:
                type:
                  - string
                  - 'null'
              url:
                type:
                  - string
                  - 'null'
              indices:
                type:
                  - array
                  - 'null'
                items:
                  type: integer
        client:
          type:
            - string
            - 'null'
          description: The app the post was made from.
        provider:
          type:
            - string
            - 'null'
    Thread:
      type: object
      properties:
        root_id:
          type: string
        author:
          $ref: '#/components/schemas/User'
        count:
          type: integer
        truncated:
          type: boolean
          description: True when max_tweets cut the thread short.
        tweets:
          type: array
          items:
            $ref: '#/components/schemas/Tweet'
    Timeline:
      type: object
      properties:
        handle:
          type: string
        count:
          type: integer
        next_cursor:
          type:
            - string
            - 'null'
          description: Pass back as ?cursor= for the next page.
        tweets:
          type: array
          items:
            $ref: '#/components/schemas/Tweet'
    SearchResult:
      type: object
      properties:
        query:
          type: string
        feed:
          type: string
          enum:
            - latest
            - top
            - photos
            - videos
        since:
          type:
            - string
            - 'null'
          format: date-time
        until:
          type:
            - string
            - 'null'
          format: date-time
        count:
          type: integer
          description: Posts on this page.
        next_cursor:
          type:
            - string
            - 'null'
          description: Pass back as ?cursor= for the next page.
        tweets:
          type: array
          items:
            $ref: '#/components/schemas/Tweet'
    Replies:
      type: object
      properties:
        tweet_id:
          type: string
        tweet_url:
          type: string
          format: uri
        sort:
          type: string
          enum:
            - top
            - recent
        count:
          type: integer
          description: Replies returned.
        tweet:
          $ref: '#/components/schemas/Tweet'
        replies:
          type: array
          description: Direct replies to the post only.
          items:
            $ref: '#/components/schemas/Tweet'
    UserList:
      type: object
      properties:
        handle:
          type: string
        relation:
          type: string
          enum:
            - followers
            - following
        count:
          type: integer
          description: Accounts on this page.
        next_cursor:
          type:
            - string
            - 'null'
          description: Pass back as ?cursor= for the next page; null on the last one.
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    AccountHistory:
      type: object
      properties:
        handle:
          type: string
        count:
          type: integer
        include_replies:
          type: boolean
        since:
          type:
            - string
            - 'null'
          format: date-time
        until:
          type:
            - string
            - 'null'
          format: date-time
        truncated:
          type: boolean
          description: True when max_posts stopped the walk before the timeline or the date window ran out.
        newest:
          type:
            - string
            - 'null'
          format: date-time
        oldest:
          type:
            - string
            - 'null'
          format: date-time
        tweets:
          type: array
          items:
            $ref: '#/components/schemas/Tweet'
    Trends:
      type: object
      properties:
        count:
          type: integer
        trends:
          type: array
          items:
            type: object
            properties:
              rank:
                type: integer
              name:
                type:
                  - string
                  - 'null'
              context:
                type:
                  - string
                  - 'null'
              posts:
                type:
                  - integer
                  - 'null'
              url:
                type:
                  - string
                  - 'null'
    MediaList:
      type: object
      properties:
        tweet_id:
          type: string
        tweet_url:
          type: string
          format: uri
        author:
          type:
            - string
            - 'null'
        count:
          type: integer
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
    BulkResult:
      type: object
      properties:
        requested:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              ok:
                type: boolean
              input:
                type: string
              tweet:
                $ref: '#/components/schemas/Tweet'
              error:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status:
              type: integer
            code:
              type: string
              enum:
                - bad_request
                - not_found
                - rate_limited
                - opted_out
                - internal_error
                - upstream_failed
                - upstream_timeout
                - search_unavailable
            reason:
              type: string
              enum:
                - post_deleted
                - author_protected
                - author_suspended
                - withheld
                - removed_by_x
                - age_restricted
                - unavailable
              description: >-
                On a not_found for a post: why it cannot be read, when X says. `unavailable` when it
                does not.
            message:
              type: string
              description: What went wrong.
            hint:
              type: string
              description: What to do about it.
            documentation:
              type: string
              format: uri
