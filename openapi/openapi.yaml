openapi: 3.1.0
info:
  title: XCrap API
  version: 1.0.0
  summary: Read public posts from X as Markdown, JSON, YAML, CSV or HTML. No API key.
  description: |-
    XCrap reads publicly visible posts, threads and profiles from X (formerly
    Twitter) and returns them in whichever of five formats you ask for.

    ## Authentication

    There is none. No key, no token, no header. Rate limits are applied per IP
    address and per endpoint.

    ## Formats

    JSON is the default. Add `?format=markdown` (or yaml, csv, html) or send a
    matching `Accept` header. The query parameter wins when both are present.

    Markdown responses carry an `x-markdown-tokens` header estimating what the
    body will cost to read, so an agent can budget its context before pulling it.

    ## What it will not do

    XCrap reads public accounts only: their posts, profiles, the replies under
    their posts and their follower lists. Protected accounts, direct messages and
    anything behind a personal login return 404. Accounts that have asked to be
    excluded return 451, and are left out of every list and every set of replies.

    ## Your responsibility

    XCrap is a conduit. You decide what to request and what to do with it, and
    the compliance obligations that follow are yours.
  termsOfService: https://xcrap.cc/terms
  contact:
    name: XCrap
    url: https://xcrap.cc/about
    email: legal@xcrap.cc
  license:
    name: Free to use
    url: https://xcrap.cc/terms
servers:
  - url: https://xcrap.cc
    description: Production
externalDocs:
  description: Guides and examples
  url: https://xcrap.cc/how-to-use
tags:
  - name: XCrap
    description: Extraction endpoints. All read-only, all keyless.
paths:
  /v1/tweet:
    get:
      operationId: tweet
      summary: One post, fully resolved
      description: >-
        Fetches a single post with its author, every engagement counter, attached media at every
        bitrate, poll results, and the quoted post unnested one level.


        Rate limit: 45 requests per 1 minute(s) per IP.


        Example:

            https://xcrap.cc/v1/tweet?url=https://x.com/jack/status/20&format=markdown
      tags:
        - XCrap
      parameters:
        - name: url
          in: query
          required: true
          description: >-
            The post URL or its numeric id. x.com, twitter.com, the fx/vx mirrors and a bare id all
            work.
          schema:
            type: string
        - name: download
          in: query
          required: false
          description: Send Content-Disposition so a browser saves the response as a file.
          schema:
            type: boolean
        - name: signals
          in: query
          required: false
          description: >-
            Add signals: the post's age, whether it is inside For You's 48-hour window, whether the
            author may qualify for X's new-author slot, and engagement ratios. Facts from public
            data, not a ranking score.
          schema:
            type: boolean
            default: 'false'
        - name: format
          in: query
          required: false
          description: 'Response format: json, markdown, yaml, csv or html. Overrides the Accept header.'
          schema:
            type: string
            enum:
              - json
              - markdown
              - yaml
              - csv
              - html
            default: json
        - name: fresh
          in: query
          required: false
          description: Skip the cache and refetch from upstream. Use sparingly.
          schema:
            type: boolean
            default: 'false'
      responses:
        '200':
          description: Success
          headers:
            x-ratelimit-limit:
              schema:
                type: integer
              description: Requests allowed in the window for this endpoint.
            x-ratelimit-remaining:
              schema:
                type: integer
              description: Requests left in the current window.
            x-ratelimit-reset:
              schema:
                type: integer
              description: Unix seconds when the window resets.
            x-xcrap-cache:
              schema:
                type: string
              description: hit, miss or bypass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tweet'
            text/markdown:
              schema:
                type: string
              example: |-
                # jack (@jack)

                just setting up my twttr
            application/yaml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '400':
          description: A parameter is missing or malformed. Check it against this page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            The post or account is deleted, suspended, private, or never existed. For a post, reason
            says which when X tells us: post_deleted, author_protected, author_suspended, withheld,
            removed_by_x, age_restricted, or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >-
            Endpoint budget exhausted. Wait for the period in retry-after, or see the enterprise
            plan for higher limits.
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait.
            x-ratelimit-limit:
              schema:
                type: integer
              description: Requests allowed in the window for this endpoint.
            x-ratelimit-remaining:
              schema:
                type: integer
              description: Requests left in the current window.
            x-ratelimit-reset:
              schema:
                type: integer
              description: Unix seconds when the window resets.
            x-xcrap-cache:
              schema:
                type: string
              description: hit, miss or bypass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '451':
          description: That account asked to be excluded from XCrap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Every source refused. Usually brief; retry in a minute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/thread:
    get:
      operationId: thread
      summary: A whole thread, unrolled in order
      description: >-
        Give it any post in a thread, including the first, and it returns the author's posts in
        reading order. X only exposes a post's parent, so XCrap stitches the author's timeline by
        conversation id to walk the thread forwards.


        Rate limit: 15 requests per 1 minute(s) per IP.


        Example:

            https://xcrap.cc/v1/thread?url=https://x.com/naval/status/1002103360646823936&format=markdown
