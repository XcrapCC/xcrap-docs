        - XCrap
      parameters:
        - name: url
          in: query
          required: true
          description: Any post in the thread.
          schema:
            type: string
        - name: max_tweets
          in: query
          required: false
          description: How deep to go, 1 to 100. The response says whether it was truncated.
          schema:
            type: integer
            default: '25'
        - name: format
          in: query
          required: false
          description: 'Response format: json, markdown, yaml, csv or html. Overrides the Accept header.'
